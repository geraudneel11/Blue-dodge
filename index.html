// SON (Web Audio API, genere, sans fichiers)

let audioCtx = null;
let muted = localStorage.getItem(MUTED_KEY) === "1";

function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { /* ignore */ }
  } else if (audioCtx.state === "suspended") {
    audioCtx.resume().catch(() => {});
  }
}

function beep(freq, duration, type, volume) {
  if (muted || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || "square";
  osc.frequency.value = freq;
  const vol = volume === undefined ? 0.15 : volume;
  const now = audioCtx.currentTime;
  gain.gain.setValueAtTime(vol, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + duration);
}

function sfxClick() { beep(520, 0.08, "square", 0.12); }
function sfxCollision() { beep(120, 0.25, "sawtooth", 0.20); }
function sfxLevelUp() {
  beep(660, 0.10, "square", 0.14);
  setTimeout(() => beep(880, 0.12, "square", 0.14), 90);
  setTimeout(() => beep(1100, 0.16, "square", 0.14), 180);
}
function sfxPowerup() { beep(950, 0.15, "triangle", 0.16); }

function vibrate(pattern) {
  if (navigator.vibrate) { try { navigator.vibrate(pattern); } catch (e) { /* ignore */ } }
}

// ============================================================
// UTILITAIRES COULEUR / TEXTE / FORMES NEON
// ============================================================

function shadeColor(hex, amount) {
  const num = parseInt(hex.replace("#", ""), 16);
  let r = (num >> 16) + amount;
  let g = ((num >> 8) & 0xff) + amount;
  let b = (num & 0xff) + amount;
  r = Math.max(0, Math.min(255, r));
  g = Math.max(0, Math.min(255, g));
  b = Math.max(0, Math.min(255, b));
  return "#" + (r << 16 | g << 8 | b).toString(16).padStart(6, "0");
}

function roundRectPath(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function drawNeonText(text, x, y, size, color, glow, align, weight) {
  glow = glow === undefined ? 18 : glow;
  align = align || "center";
  weight = weight || 700;
  ctx.font = weight + " " + size + "px 'Orbitron', sans-serif";
  ctx.textAlign = align;
  ctx.textBaseline = "middle";
  ctx.shadowColor = color;
  ctx.shadowBlur = glow;
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.shadowBlur = 0;
  ctx.fillStyle = "rgba(255,255,255,0.9)";
  ctx.globalAlpha = 0.15;
  ctx.fillText(text, x, y);
  ctx.globalAlpha = 1;
}

function neonRect(x, y, w, h, color, glow) {
  glow = glow === undefined ? 16 : glow;
  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = glow;

  const grad = ctx.createLinearGradient(x, y, x + w, y + h);
  grad.addColorStop(0, shadeColor(color, -60));
  grad.addColorStop(0.5, color);
  grad.addColorStop(1, shadeColor(color, -60));
  ctx.fillStyle = grad;
  ctx.fillRect(x, y, w, h);

  ctx.shadowBlur = 0;
  ctx.strokeStyle = "rgba(255,255,255,0.55)";
  ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, Math.max(w - 1, 0), Math.max(h - 1, 0));

  ctx.strokeStyle = "rgba(255,255,255,0.22)";
  ctx.beginPath();
  const step = Math.max(7, Math.min(w, h) / 3.2);
  if (w >= h) {
    for (let i = step; i < w; i += step) { ctx.moveTo(x + i, y); ctx.lineTo(x + i, y + h); }
  } else {
    for (let i = step; i < h; i += step) { ctx.moveTo(x, y + i); ctx.lineTo(x + w, y + i); }
  }
  ctx.stroke();
  ctx.restore();
}

function drawNeonButton(rect, label, color, fontScale) {
  fontScale = fontScale || 0.42;
  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = 20;
  ctx.fillStyle = "rgba(6,10,14,0.65)";
  roundRectPath(ctx, rect.x, rect.y, rect.w, rect.h, rect.h * 0.22);
  ctx.fill();
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = color;
  ctx.stroke();
  ctx.restore();
  drawNeonText(label, rect.x + rect.w / 2, rect.y + rect.h / 2, rect.h * fontScale, color, 14);
}

function drawIconButton(rect, symbol, color, active) {
  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = active ? 18 : 8;
  ctx.fillStyle = "rgba(6,10,14,0.55)";
  roundRectPath(ctx, rect.x, rect.y, rect.w, rect.h, 10);
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = color;
  ctx.stroke();
  ctx.restore();
  drawNeonText(symbol, rect.x + rect.w / 2, rect.y + rect.h / 2 + 1, rect.h * 0.5, color, 10, "center", 700);
}

function pointInRect(px, py, r) {
  return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
}

// ============================================================
// UTILITAIRES JEU
// ============================================================

function rand(min, max) { return Math.random() * (max - min) + min; }
function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
function choice(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function inflate(rect, dw, dh) {
  return { x: rect.x - dw / 2, y: rect.y - dh / 2, w: rect.w + dw, h: rect.h + dh };
}

function getLevelEnemyCount(lvl) { return Math.min(2 + Math.floor((lvl - 1) / 4), 13); }
function getBlueSpeed(lvl) { return 190 + lvl * 7; }
function getGreenSpeed(lvl) { return 310 + lvl * 9; }
function getGreenChance(lvl) { if (lvl < 5) return 0.0; return Math.min(0.08 + (lvl - 5) * 0.006, 0.30); }
function getPinkChance(lvl) { if (lvl < 8) return 0.0; return Math.min(0.05 + (lvl - 8) * 0.004, 0.18); }

// ============================================================
// ENNEMI ROSE - VIRAGES A 90 DEGRES ("EFFET WAGON")
//
// Le rectangle rose ne pivote plus instantanement : quand son
// avant atteint un point de pivot tire aleatoirement, l'avant se
// fige a ce point pendant que l'arriere continue d'avancer, ce qui
// fait "reculer" (retrecir) le segment d'origine. Au meme moment
// un second segment nait au point de pivot dans la nouvelle
// direction et grandit exactement de ce que le premier perd, de
// sorte que la longueur totale (segment A + segment B) reste
// toujours egale a la longueur initiale du rectangle. Quand le
// segment A atteint une longueur de 0, le virage est termine et le
// segment B devient le rectangle "normal" de l'ennemi.
// ============================================================

const DIR_ORDER = ["up", "right", "down", "left"];
function rotateDir(dir, clockwise) {
  const idx = DIR_ORDER.indexOf(dir);
  const next = clockwise ? (idx + 1) % 4 : (idx + 3) % 4;
  return DIR_ORDER[next];
}

function dirVector(dir) {
  if (dir === "right") return { x: 1, y: 0 };
  if (dir === "left") return { x: -1, y: 0 };
  if (dir === "down") return { x: 0, y: 1 };
  return { x: 0, y: -1 }; // up
}

function isHorizontal(dir) { return dir === "left" || dir === "right"; }

function applyDirection(e, dir, length, thickness, speed) {
  if (isHorizontal(dir)) {
    e.w = length; e.h = thickness;
    e.dx = dir === "right" ? speed : -speed;
    e.dy = 0;
  } else {
    e.w = thickness; e.h = length;
    e.dy = dir === "down" ? speed : -speed;
    e.dx = 0;
  }
}

// Choisit, le long de l'axe de deplacement courant, la coordonnee
// (x pour horizontal, y pour vertical) ou le prochain virage se
// declenchera. Tire aleatoirement avec une marge pour ne pas coller
// aux bords de l'ecran.
function pickNextTurnCoord(dir) {
  if (isHorizontal(dir)) return rand(WIDTH * 0.18, WIDTH * 0.82);
  return rand(HEIGHT * 0.18, HEIGHT * 0.82);
}

function getFrontCoord(e, dir) {
  if (dir === "right") return e.x + e.w;
  if (dir === "left") return e.x;
  if (dir === "down") return e.y + e.h;
  return e.y; // up
}

function hasReachedTurnCoord(e, dir) {
  const front = getFrontCoord(e, dir);
  if (dir === "right" || dir === "down") return front >= e.nextTurnCoord;
  return front <= e.nextTurnCoord; // left / up
}

// Construit le rectangle d'un segment de longueur `len` accroche au
// point de pivot `pivot`. mode "back": le pivot est l'AVANT du
// segment (le segment s'etend vers l'arriere, dans -dir) - utilise
// pour le segment A qui retrecit. mode "front": le pivot est
// l'ARRIERE du segment (le segment s'etend vers l'avant, dans dir)
// - utilise pour le segment B qui grandit.
function buildSegmentRect(pivot, dir, len, thickness, mode) {
  const v = dirVector(dir);
  len = Math.max(0, len);
  if (isHorizontal(dir)) {
    let x;
    if (mode === "back") x = v.x > 0 ? pivot.x - len : pivot.x;
    else x = v.x > 0 ? pivot.x : pivot.x - len;
    return { x, y: pivot.y - thickness / 2, w: len, h: thickness };
  } else {
    let y;
    if (mode === "back") y = v.y > 0 ? pivot.y - len : pivot.y;
    else y = v.y > 0 ? pivot.y : pivot.y - len;
    return { x: pivot.x - thickness / 2, y, w: thickness, h: len };
  }
}

// Renvoie les rectangles a dessiner/collisionner pour un ennemi rose :
// un seul rectangle hors virage, deux (segment A + segment B, la
// forme en "L") pendant un virage.
function getPinkSegments(e) {
  if (!e.turning) return [{ x: e.x, y: e.y, w: e.w, h: e.h }];
  const segs = [];
  if (e.turnSegALen > 0) {
    segs.push(buildSegmentRect(e.turnPivot, e.turnOldDir, e.turnSegALen, e.thickness, "back"));
  }
  const segBLen = e.turnTotalLen - e.turnSegALen;
  if (segBLen > 0) {
    segs.push(buildSegmentRect(e.turnPivot, e.turnNewDir, segBLen, e.thickness, "front"));
  }
  return segs;
}

function startPinkTurn(e) {
  const clockwise = Math.random() < 0.5;
  const newDir = rotateDir(e.dir, clockwise);
  const pivot = isHorizontal(e.dir)
    ? { x: e.nextTurnCoord, y: e.y + e.h / 2 }
    : { x: e.x + e.w / 2, y: e.nextTurnCoord };

  e.turning = true;
  e.turnOldDir = e.dir;
  e.turnNewDir = newDir;
  e.turnPivot = pivot;
  e.turnTotalLen = e.length;
  e.turnSegALen = e.length;

  // fige e.dx/e.dy : pendant le virage le deplacement est gere
  // directement par updatePinkEnemy via turnSegALen
  e.dx = 0; e.dy = 0;
}

function finishPinkTurn(e) {
  const pivot = e.turnPivot;
  const newDir = e.turnNewDir;
  e.dir = newDir;
  applyDirection(e, newDir, e.turnTotalLen, e.thickness, e.speed);
  // le segment B (arriere au pivot, avant a pivot + totalLen*dir) devient le rectangle normal
  const backRect = buildSegmentRect(pivot, newDir, e.turnTotalLen, e.thickness, "front");
  e.x = backRect.x; e.y = backRect.y;
  e.turning = false;
  e.turnsLeft -= 1;
  if (e.turnsLeft > 0) e.nextTurnCoord = pickNextTurnCoord(e.dir);
}

function updatePinkEnemy(e, dt, speedMul) {
  if (e.turning) {
    e.turnSegALen -= e.speed * dt * speedMul;
    if (e.turnSegALen <= 0) {
      e.turnSegALen = 0;
      finishPinkTurn(e);
    }
    return;
  }
  if (e.turnsLeft > 0 && hasReachedTurnCoord(e, e.dir)) startPinkTurn(e);
}

// ============================================================
// CREATION D'UN ENNEMI
// ============================================================

function pickEnemyType() {
  const r = Math.random();
  const pinkChance = getPinkChance(level);
  const greenChance = getGreenChance(level);
  if (r < pinkChance) return "pink";
  if (r < pinkChance + greenChance) return "green";
  return "blue";
}

function createEnemy(forceType) {
  const type = forceType || pickEnemyType();

  const [modelLength, modelThickness] = choice(RECTANGLE_MODELS);
  let speed, color;
  if (type === "pink") { speed = getGreenSpeed(level) * rand(0.90, 1.10); color = PINK; }
  else if (type === "green") { speed = getGreenSpeed(level) * rand(0.90, 1.10); color = GREEN; }
  else { speed = getBlueSpeed(level) * rand(0.85, 1.15); color = BLUE; }

  const direction = choice(["horizontal", "vertical"]);
  let x, y, dx, dy, w, h;

  if (direction === "horizontal") {
    if (Math.random() < 0.5) { x = -modelLength; dx = speed; } else { x = WIDTH; dx = -speed; }
    y = randInt(55, Math.max(56, HEIGHT - 55 - modelThickness));
    dy = 0; w = modelLength; h = modelThickness;
  } else {
    if (Math.random() < 0.5) { y = -modelLength; dy = speed; } else { y = HEIGHT; dy = -speed; }
    x = randInt(55, Math.max(56, WIDTH - 55 - modelThickness));
    dx = 0; w = modelThickness; h = modelLength;
  }

  const dir = direction === "horizontal" ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");

  const enemy = {
    x, y, dx, dy, w, h, color, type,
    length: modelLength, thickness: modelThickness,
    speed, dir
  };

  if (type === "pink") {
    enemy.turnsLeft = 3;
    enemy.turning = false;
    enemy.nextTurnCoord = pickNextTurnCoord(enemy.dir);
  }

  return enemy;
}

// Renvoie le ou les rectangles a utiliser pour le rendu/la collision
// d'un ennemi : un seul rectangle normalement, deux (forme en "L")
// pour un ennemi rose en cours de virage.
function getEnemyRects(e) {
  if (e.type === "pink") return getPinkSegments(e);
  return [{ x: e.x, y: e.y, w: e.w, h: e.h }];
}

function enemyOverlapsRect(e, rect) {
  for (const seg of getEnemyRects(e)) if (rectsOverlap(seg, rect)) return true;
  return false;
}

function drawEnemy(e) {
  for (const seg of getEnemyRects(e)) neonRect(seg.x, seg.y, seg.w, seg.h, e.color, 14);
}

function playerIsSafeAt(candidate) {
  const safe = inflate(candidate, 70, 70);
  for (const e of enemies) if (enemyOverlapsRect(e, safe)) return false;
  return true;
}

function respawnPlayerSafe() {
  for (let attempt = 0; attempt < 150; attempt++) {
    const x = randInt(30, Math.max(31, WIDTH - PLAYER_SIZE - 30));
    const y = randInt(70, Math.max(71, HEIGHT - PLAYER_SIZE - 30));
    const candidate = { x, y, w: PLAYER_SIZE, h: PLAYER_SIZE };
    if (playerIsSafeAt(candidate)) { player.x = x; player.y = y; return; }
  }
  resetPlayer();
}

function createLevel() {
  enemies = [];
  const target = getLevelEnemyCount(level);
  const playerZone = inflate(player, 180, 180);
  for (let i = 0; i < target; i++) {
    let enemy = createEnemy();
    let tries = 0;
    while (rectsOverlap(enemy, playerZone) && tries < 30) { enemy = createEnemy(); tries++; }
    enemies.push(enemy);
  }
}

// ============================================================
// PARTICULES
// ============================================================

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = rand(60, 220);
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: rand(0.4, 0.9),
      maxLife: 0.9,
      color,
      size: rand(3, 7)
    });
  }
}

function updateParticles(dt) {
  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.94; p.vy *= 0.94;
    p.life -= dt;
  }
  particles = particles.filter((p) => p.life > 0);
}

function drawParticles() {
  for (const p of particles) {
    const alpha = Math.max(0, p.life / p.maxLife);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 10;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    ctx.restore();
  }
}

// ============================================================
// POWER-UPS
// ============================================================

const POWERUP_TYPES = [
  { type: "shield", color: BLUE, symbol: "B" },
  { type: "slow", color: GREEN, symbol: "R" },
  { type: "life", color: RED, symbol: "+" }
];

function trySpawnPowerup() {
  if (powerups.length > 0) return;
  const def = choice(POWERUP_TYPES);
  const size = 38;
  for (let attempt = 0; attempt < 40; attempt++) {
    const x = randInt(50, Math.max(51, WIDTH - 50 - size));
    const y = randInt(90, Math.max(91, HEIGHT - 150 - size));
    const candidate = { x, y, w: size, h: size };
    const safeZone = inflate(candidate, 50, 50);
    let clear = true;
    for (const e of enemies) if (enemyOverlapsRect(e, safeZone)) { clear = false; break; }
    if (clear) {
      powerups.push({ x, y, w: size, h: size, type: def.type, color: def.color, symbol: def.symbol, life: 6.5, t: 0 });
      return;
    }
  }
}

function updatePowerups(dt) {
  powerupSpawnTimer -= dt;
  if (powerupSpawnTimer <= 0) {
    trySpawnPowerup();
    powerupSpawnTimer = rand(9, 15);
  }
  for (const p of powerups) { p.life -= dt; p.t += dt; }
  powerups = powerups.filter((p) => p.life > 0);
}

function applyPowerup(p) {
  sfxPowerup();
  spawnParticles(p.x + p.w / 2, p.y + p.h / 2, p.color, 16);
  if (p.type === "shield") {
    invincibleTimer = Math.max(invincibleTimer, SHIELD_TIME);
  } else if (p.type === "slow") {
    slowTimer = SLOW_TIME;
  } else if (p.type === "life") {
    if (lives < MAX_LIVES) lives += 1; else score += 200;
  }
}

function drawPowerups() {
  for (const p of powerups) {
    const pulse = 1 + 0.08 * Math.sin(p.t * 6);
    const w = p.w * pulse, h = p.h * pulse;
    const x = p.x + p.w / 2 - w / 2, y = p.y + p.h / 2 - h / 2;
    ctx.save();
    ctx.translate(x + w / 2, y + h / 2);
    ctx.rotate(Math.PI / 4);
    neonRect(-w / 2, -h / 2, w, h, p.color, 18);
    ctx.restore();
    drawNeonText(p.symbol, p.x + p.w / 2, p.y + p.h / 2 + 1, p.w * 0.5, WHITE, 6, "center", 900);
  }
}

// ============================================================
// FOND FLOUTE (capture figee de la partie)
// ============================================================

const bgCanvas = document.createElement("canvas");
const bgCtx = bgCanvas.getContext("2d");
let hasBackgroundSnapshot = false;

function captureBackgroundSnapshot() {
  bgCanvas.width = canvas.width;
  bgCanvas.height = canvas.height;
  bgCtx.drawImage(canvas, 0, 0);
  hasBackgroundSnapshot = true;
}

function drawBlurredBackground() {
  ctx.fillStyle = BLACK;
  ctx.fillRect(0, 0, WIDTH, HEIGHT);
  if (hasBackgroundSnapshot) {
    ctx.save();
    ctx.filter = "blur(14px) brightness(0.45) saturate(1.3)";
    ctx.drawImage(bgCanvas, 0, 0, WIDTH, HEIGHT);
    ctx.restore();
  }
  const grad = ctx.createLinearGradient(0, 0, 0, HEIGHT);
  grad.addColorStop(0, "rgba(0,0,0,0.35)");
  grad.addColorStop(1, "rgba(0,0,0,0.75)");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, WIDTH, HEIGHT);
}

// ============================================================
// TRANSITIONS D'ETAT
// ============================================================

function renderSceneFrame() {
  ctx.fillStyle = BLACK;
  ctx.fillRect(0, 0, WIDTH, HEIGHT);
  for (const e of enemies) drawEnemy(e);
  neonRect(player.x, player.y, player.w, player.h, RED, 18);
  ctx.strokeStyle = "rgba(255,255,255,0.5)";
  ctx.lineWidth = 3;
  ctx.strokeRect(1.5, 1.5, WIDTH - 3, HEIGHT - 3);
}

function goToMenu() {
  renderSceneFrame();
  captureBackgroundSnapshot();
  gameState = STATE_MENU;
}

function startGame() {
  ensureAudio();
  lives = MAX_LIVES;
  level = 1;
  score = 0;
  levelTimer = 0.0;
  waitingForClear = false;
  respawnTimer = 0.0;
  invincibleTimer = 0.0;
  slowTimer = 0.0;
  particles = [];
  powerups = [];
  powerupSpawnTimer = rand(7, 11);
  resetPlayer();
  createLevel();
  gameState = STATE_PLAYING;
}

function endGame(won) {
  updateBests();
  renderSceneFrame();
  captureBackgroundSnapshot();
  gameState = won ? STATE_VICTORY : STATE_GAMEOVER;
}

function loseLife() {
  lives -= 1;
  spawnParticles(player.x + player.w / 2, player.y + player.h / 2, RED, 18);
  vibrate(80);
  sfxCollision();
  respawnPlayerSafe();
  invincibleTimer = INVINCIBLE_TIME;
  respawnTimer = RESPAWN_DELAY;
}

// ============================================================
// ENTREES : CLAVIER
// ============================================================

const keysDown = {};
window.addEventListener("keydown", (e) => {
  keysDown[e.key.toLowerCase()] = true;
  const k = e.key.toLowerCase();
  if (k === "r" && (gameState === STATE_GAMEOVER || gameState === STATE_VICTORY)) startGame();
  if ((e.key === "Enter" || e.key === " ") && gameState === STATE_MENU) startGame();
  if ((k === "p" || e.key === "Escape") && gameState === STATE_PLAYING) gameState = STATE_PAUSED;
  else if ((k === "p" || e.key === "Escape") && gameState === STATE_PAUSED) gameState = STATE_PLAYING;
});
window.addEventListener("keyup", (e) => { keysDown[e.key.toLowerCase()] = false; });

// ============================================================
// ENTREES : TACTILE / SOURIS
// ============================================================

const activeTouches = new Map();

function canvasPointFromEvent(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return { x: clientX - rect.left, y: clientY - rect.top };
}

function handleGlobalTap(p) {
  if (pointInRect(p.x, p.y, muteButton)) {
    muted = !muted;
    localStorage.setItem(MUTED_KEY, muted ? "1" : "0");
    if (!muted) sfxClick();
    return;
  }
  if (gameState === STATE_MENU) {
    if (pointInRect(p.x, p.y, playButton)) { sfxClick(); startGame(); }
    return;
  }
  if (gameState === STATE_PLAYING) {
    if (pointInRect(p.x, p.y, pauseButton)) { sfxClick(); gameState = STATE_PAUSED; }
    return;
  }
  if (gameState === STATE_PAUSED) {
    if (pointInRect(p.x, p.y, restartButton)) { sfxClick(); gameState = STATE_PLAYING; }
    else if (pointInRect(p.x, p.y, menuButton)) { sfxClick(); goToMenu(); }
    return;
  }
  if (gameState === STATE_GAMEOVER || gameState === STATE_VICTORY) {
    if (pointInRect(p.x, p.y, restartButton)) { sfxClick(); startGame(); }
    else if (pointInRect(p.x, p.y, menuButton)) { sfxClick(); goToMenu(); }
  }
}

function handleTouchStart(e) {
  e.preventDefault();
  ensureAudio();
  for (const t of e.changedTouches) {
    const p = canvasPointFromEvent(t.clientX, t.clientY);
    activeTouches.set(t.identifier, p);
    handleGlobalTap(p);
  }
}
function handleTouchMove(e) {
  e.preventDefault();
  for (const t of e.changedTouches) activeTouches.set(t.identifier, canvasPointFromEvent(t.clientX, t.clientY));
}
function handleTouchEnd(e) {
  e.preventDefault();
  for (const t of e.changedTouches) activeTouches.delete(t.identifier);
}
canvas.addEventListener("touchstart", handleTouchStart, { passive: false });
canvas.addEventListener("touchmove", handleTouchMove, { passive: false });
canvas.addEventListener("touchend", handleTouchEnd, { passive: false });
canvas.addEventListener("touchcancel", handleTouchEnd, { passive: false });

let mouseDown = false;
let mousePos = { x: 0, y: 0 };
canvas.addEventListener("mousedown", (e) => {
  ensureAudio();
  mouseDown = true;
  mousePos = canvasPointFromEvent(e.clientX, e.clientY);
  handleGlobalTap(mousePos);
});
canvas.addEventListener("mousemove", (e) => { mousePos = canvasPointFromEvent(e.clientX, e.clientY); });
window.addEventListener("mouseup", () => { mouseDown = false; });

function getTouchControls() {
  let up = false, down = false, left = false, right = false;
  for (const p of activeTouches.values()) {
    if (pointInRect(p.x, p.y, buttonUp)) up = true;
    if (pointInRect(p.x, p.y, buttonDown)) down = true;
    if (pointInRect(p.x, p.y, buttonLeft)) left = true;
    if (pointInRect(p.x, p.y, buttonRight)) right = true;
  }
  if (mouseDown) {
    if (pointInRect(mousePos.x, mousePos.y, buttonUp)) up = true;
    if (pointInRect(mousePos.x, mousePos.y, buttonDown)) down = true;
    if (pointInRect(mousePos.x, mousePos.y, buttonLeft)) left = true;
    if (pointInRect(mousePos.x, mousePos.y, buttonRight)) right = true;
  }
  return { up, down, left, right };
}

// ============================================================
// REDIMENSIONNEMENT PLEIN ECRAN
// ============================================================

function resize() {
  WIDTH = window.innerWidth;
  HEIGHT = window.innerHeight;
  canvas.width = WIDTH;
  canvas.height = HEIGHT;
  canvas.style.width = WIDTH + "px";
  canvas.style.height = HEIGHT + "px";
  computeLayout();
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", resize);

// ============================================================
// FLECHES DE CONTROLE (reduites visuellement, zone cliquable inchangee)
// ============================================================

function drawArrow(rect, direction) {
  const cx = rect.x + rect.w / 2;
  const cy = rect.y + rect.h / 2;
  const s = rect.w * 0.34;
  ctx.save();
  ctx.shadowColor = BLUE;
  ctx.shadowBlur = 14;
  ctx.fillStyle = "rgba(255,255,255,0.92)";
  ctx.beginPath();
  if (direction === "up") { ctx.moveTo(cx, cy - s); ctx.lineTo(cx - s, cy + s * 0.8); ctx.lineTo(cx + s, cy + s * 0.8); }
  else if (direction === "down") { ctx.moveTo(cx, cy + s); ctx.lineTo(cx - s, cy - s * 0.8); ctx.lineTo(cx + s, cy - s * 0.8); }
  else if (direction === "left") { ctx.moveTo(cx - s, cy); ctx.lineTo(cx + s * 0.8, cy - s); ctx.lineTo(cx + s * 0.8, cy + s); }
  else { ctx.moveTo(cx + s, cy); ctx.lineTo(cx - s * 0.8, cy - s); ctx.lineTo(cx - s * 0.8, cy + s); }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// ============================================================
// INTERFACE EN JEU
// ============================================================

function drawUI() {
  drawNeonText("NIVEAU " + level + " / " + MAX_LEVEL, 26, 34, 20, BLUE, 10, "left");
  drawNeonText("SCORE " + Math.floor(score), WIDTH / 2, 34, 20, WHITE, 10, "center");

  for (let i = 0; i < MAX_LIVES; i++) {
    const x = WIDTH - 95 + i * 30;
    const y = 68;
    if (i < lives) neonRect(x, y, 20, 20, RED, 12);
    else { ctx.strokeStyle = GRAY; ctx.lineWidth = 2; ctx.strokeRect(x, y, 20, 20); }
  }

  drawIconButton(muteButton, muted ? "X" : "S", muted ? GRAY : GREEN, !muted);
  drawIconButton(pauseButton, "II", BLUE, true);

  if (waitingForClear) drawNeonText("NETTOYAGE...", WIDTH / 2, 60, 16, GREEN, 10);
  if (slowTimer > 0) drawNeonText("RALENTI ACTIF", WIDTH / 2, HEIGHT - 150, 16, GREEN, 10);
}

// ============================================================
// ECRAN MENU
// ============================================================

function drawMenuScreen() {
  drawBlurredBackground();

  drawNeonText("BLUE DODGE", WIDTH / 2, HEIGHT * 0.26, Math.min(72, WIDTH * 0.11), BLUE, 28, "center", 900);
  drawNeonText("ESQUIVE OU DISPARAIS", WIDTH / 2, HEIGHT * 0.26 + Math.min(72, WIDTH * 0.11) * 0.62, Math.min(20, WIDTH * 0.03), WHITE, 8, "center", 500);

  drawNeonText("MEILLEUR SCORE : " + bestScore, WIDTH / 2, HEIGHT * 0.42, Math.min(24, WIDTH * 0.036), WHITE, 10, "center", 700);

  drawNeonButton(playButton, "JOUER", RED, 0.4);

  drawIconButton(muteButton, muted ? "X" : "S", muted ? GRAY : GREEN, !muted);

  drawNeonText(STUDIO_NAME, WIDTH / 2, HEIGHT - 46, 18, WHITE, 8, "center", 500);
  drawNeonText(GAME_VERSION, WIDTH - 20, HEIGHT - 20, 14, GRAY, 4, "right", 500);
}

// ============================================================
// ECRAN PAUSE
// ============================================================

function drawPauseScreen() {
  drawBlurredBackground();
  drawNeonText("PAUSE", WIDTH / 2, HEIGHT * 0.30, Math.min(56, WIDTH * 0.08), BLUE, 24, "center", 900);
  drawNeonText("Niveau " + level + " - Score " + Math.floor(score), WIDTH / 2, HEIGHT * 0.30 + Math.min(56, WIDTH * 0.08) * 0.8, Math.min(20, WIDTH * 0.03), WHITE, 8, "center", 500);
  drawNeonButton(restartButton, "REPRENDRE", GREEN, 0.30);
  drawNeonButton(menuButton, "MENU", BLUE, 0.32);
}

// ============================================================
// ECRANS FIN DE PARTIE
// ============================================================

function drawEndScreen(won) {
  drawBlurredBackground();

  const titleColor = won ? GREEN : RED;
  const titleText = won ? "VICTOIRE !" : "GAME OVER";
  drawNeonText(titleText, WIDTH / 2, HEIGHT * 0.26, Math.min(64, WIDTH * 0.09), titleColor, 26, "center", 900);

  const subText = won ? "Tu as terminé les " + MAX_LEVEL + " niveaux !" : "Score final";
  drawNeonText(subText, WIDTH / 2, HEIGHT * 0.26 + Math.min(64, WIDTH * 0.09) * 0.7, Math.min(22, WIDTH * 0.032), WHITE, 8, "center", 500);

  drawNeonText("SCORE : " + Math.floor(score) + "   MEILLEUR : " + bestScore, WIDTH / 2, HEIGHT * 0.42, Math.min(20, WIDTH * 0.03), WHITE, 8, "center", 700);

  drawNeonButton(restartButton, "REJOUER", RED, 0.32);
  drawNeonButton(menuButton, "MENU", BLUE, 0.32);
}

// ============================================================
// RENDU DE LA SCENE DE JEU (utilise en PLAYING et en PAUSED)
// ============================================================

function renderGameplay() {
  ctx.fillStyle = BLACK;
  ctx.fillRect(0, 0, WIDTH, HEIGHT);

  drawPowerups();

  for (const e of enemies) drawEnemy(e);

  if (invincibleTimer <= 0 || Math.floor(invincibleTimer * 10) % 2 === 0) {
    neonRect(player.x, player.y, player.w, player.h, RED, 20);
  }

  drawParticles();

  ctx.strokeStyle = "rgba(255,255,255,0.5)";
  ctx.lineWidth = 3;
  ctx.strokeRect(1.5, 1.5, WIDTH - 3, HEIGHT - 3);

  drawUI();

  drawArrow(buttonUp, "up");
  drawArrow(buttonLeft, "left");
  drawArrow(buttonDown, "down");
  drawArrow(buttonRight, "right");
}

// ============================================================
// BOUCLE PRINCIPALE
// ============================================================

resize();
resetPlayer();
level = 1;
createLevel();
renderSceneFrame();
captureBackgroundSnapshot();
gameState = STATE_MENU;

let lastTime = performance.now();

function loop(now) {
  let dt = (now - lastTime) / 1000.0;
  lastTime = now;
  if (dt > 0.05) dt = 0.05;

  if (gameState === STATE_MENU) { drawMenuScreen(); requestAnimationFrame(loop); return; }
  if (gameState === STATE_PAUSED) { renderGameplay(); drawPauseScreen(); requestAnimationFrame(loop); return; }
  if (gameState === STATE_GAMEOVER || gameState === STATE_VICTORY) {
    drawEndScreen(gameState === STATE_VICTORY);
    requestAnimationFrame(loop);
    return;
  }

  // --------------------------------------------------------
  // CONTROLES
  // --------------------------------------------------------
  let movingUp = keysDown["z"] || keysDown["arrowup"] || false;
  let movingDown = keysDown["s"] || keysDown["arrowdown"] || false;
  let movingLeft = keysDown["q"] || keysDown["arrowleft"] || false;
  let movingRight = keysDown["d"] || keysDown["arrowright"] || false;

  const touch = getTouchControls();
  movingUp = movingUp || touch.up;
  movingDown = movingDown || touch.down;
  movingLeft = movingLeft || touch.left;
  movingRight = movingRight || touch.right;

  // --------------------------------------------------------
  // TIMERS
  // --------------------------------------------------------
  if (invincibleTimer > 0) invincibleTimer -= dt;
  if (respawnTimer > 0) respawnTimer -= dt;
  if (slowTimer > 0) slowTimer -= dt;

  // --------------------------------------------------------
  // JOUEUR
  // --------------------------------------------------------
  if (respawnTimer <= 0) {
    let mx = 0, my = 0;
    if (movingLeft) mx -= 1;
    if (movingRight) mx += 1;
    if (movingUp) my -= 1;
    if (movingDown) my += 1;
    if (mx !== 0 || my !== 0) {
      const len = Math.sqrt(mx * mx + my * my);
      mx /= len; my /= len;
      player.x += mx * PLAYER_SPEED * dt;
      player.y += my * PLAYER_SPEED * dt;
    }
  }

  // --------------------------------------------------------
  // SCORE (survie)
  // --------------------------------------------------------
  score += dt * 12;

  // --------------------------------------------------------
  // BORDURE
  // --------------------------------------------------------
  const innerLeft = 3, innerTop = 3, innerRight = WIDTH - 3, innerBottom = HEIGHT - 3;
  const outOfBounds = player.x < innerLeft || player.y < innerTop ||
    player.x + player.w > innerRight || player.y + player.h > innerBottom;

  if (outOfBounds && invincibleTimer <= 0) {
    loseLife();
    if (lives <= 0) { endGame(false); requestAnimationFrame(loop); return; }
  }

  // --------------------------------------------------------
  // ENNEMIS - DEPLACEMENT + VIRAGES ROSES
  // --------------------------------------------------------
  const speedMul = slowTimer > 0 ? SLOW_FACTOR : 1;
  for (const e of enemies) {
    if (e.type === "pink") {
      updatePinkEnemy(e, dt, speedMul);
      if (!e.turning) { e.x += e.dx * dt * speedMul; e.y += e.dy * dt * speedMul; }
    } else {
      e.x += e.dx * dt * speedMul;
      e.y += e.dy * dt * speedMul;
    }
  }

  // --------------------------------------------------------
  // COLLISION ENNEMIS
  // --------------------------------------------------------
  if (invincibleTimer <= 0) {
    let collision = false;
    for (const e of enemies) { if (enemyOverlapsRect(e, player)) { collision = true; break; } }
    if (collision) {
      loseLife();
      if (lives <= 0) { endGame(false); requestAnimationFrame(loop); return; }
    }
  }

  // --------------------------------------------------------
  // POWER-UPS
  // --------------------------------------------------------
  updatePowerups(dt);
  for (const p of powerups) {
    if (rectsOverlap(player, p)) { applyPowerup(p); p.life = 0; }
  }
  powerups = powerups.filter((p) => p.life > 0);

  // --------------------------------------------------------
  // PARTICULES
  // --------------------------------------------------------
  updateParticles(dt);

  // --------------------------------------------------------
  // SUPPRESSION DES ENNEMIS HORS ECRAN
  // --------------------------------------------------------
  enemies = enemies.filter((e) => {
    const rects = getEnemyRects(e);
    return rects.some((r) => !(r.x + r.w < 0 || r.x > WIDTH || r.y + r.h < 0 || r.y > HEIGHT));
  });

  // --------------------------------------------------------
  // PROGRESSION
  // --------------------------------------------------------
  if (!waitingForClear) {
    levelTimer += dt;
    const requiredTime = LEVEL_TIME + level * 0.15;
    if (levelTimer >= requiredTime) waitingForClear = true;
  } else if (enemies.length === 0) {
    if (level < MAX_LEVEL) {
      level += 1;
      score += 150;
      updateBests();
      sfxLevelUp();
      spawnParticles(WIDTH / 2, HEIGHT / 2, GREEN, 26);
      levelTimer = 0.0;
      waitingForClear = false;
      respawnPlayerSafe();
      invincibleTimer = 0.8;
      createLevel();
    } else {
      endGame(true);
      requestAnimationFrame(loop);
      return;
    }
  }

  // --------------------------------------------------------
  // CREATION DES ENNEMIS
  // --------------------------------------------------------
  if (!waitingForClear) {
    const targetCount = getLevelEnemyCount(level);
    while (enemies.length < targetCount) enemies.push(createEnemy());
  }

  // --------------------------------------------------------
  // AFFICHAGE
  // --------------------------------------------------------
  renderGameplay();

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

// ============================================================
// MODE HORS LIGNE (service worker)
// ============================================================
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch(() => {});
  });
}
</script>
