<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Blue Dodge</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon_512.png">
<link rel="apple-touch-icon" href="icon_512.png">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Blue Dodge">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
    height: 100%;
    width: 100%;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #gameCanvas {
    display: block;
    background: #000;
    touch-action: none;
    position: fixed;
    top: 0;
    left: 0;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
// ============================================================
// CONFIGURATION GENERALE
// ============================================================

const GAME_VERSION = "v6";
const STUDIO_NAME = "Saucisson Studios";
const BEST_LEVEL_KEY = "blueDodgeBestLevel";

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const BLACK = "#000000";
const RED = "#ff3c3c";
const BLUE = "#3aa0ff";
const GREEN = "#3ce664";
const WHITE = "#ffffff";
const GRAY = "#464646";

let WIDTH = window.innerWidth;
let HEIGHT = window.innerHeight;

// ============================================================
// ETATS DU JEU
// ============================================================

const STATE_MENU = "menu";
const STATE_PLAYING = "playing";
const STATE_GAMEOVER = "gameover";
const STATE_VICTORY = "victory";

let gameState = STATE_MENU;

// ============================================================
// UTILITAIRES COULEUR / TEXTE / FORMES NEON
// ============================================================

function shadeColor(hex, amount) {
  const num = parseInt(hex.replace("#", ""), 16);
  let r = (num >> 16) + amount;
  let g = ((num >> 8) & 0xff) + amount;
  let b = (num & 0xff) + amount;
  r = Math.max(0, Math.min(255, r));
  g = Math.max(0, Math.min(255, g));
  b = Math.max(0, Math.min(255, b));
  return "#" + (r << 16 | g << 8 | b).toString(16).padStart(6, "0");
}

function roundRectPath(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function drawNeonText(text, x, y, size, color, glow, align, weight) {
  glow = glow === undefined ? 18 : glow;
  align = align || "center";
  weight = weight || 700;
  ctx.font = weight + " " + size + "px 'Orbitron', sans-serif";
  ctx.textAlign = align;
  ctx.textBaseline = "middle";
  ctx.shadowColor = color;
  ctx.shadowBlur = glow;
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.shadowBlur = 0;
  ctx.fillStyle = "rgba(255,255,255,0.9)";
  ctx.globalAlpha = 0.15;
  ctx.fillText(text, x, y);
  ctx.globalAlpha = 1;
}

// Rectangle "neon tech" utilisé pour le joueur et les ennemis
function neonRect(x, y, w, h, color, glow) {
  glow = glow === undefined ? 16 : glow;
  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = glow;

  const grad = ctx.createLinearGradient(x, y, x + w, y + h);
  grad.addColorStop(0, shadeColor(color, -60));
  grad.addColorStop(0.5, color);
  grad.addColorStop(1, shadeColor(color, -60));
  ctx.fillStyle = grad;
  ctx.fillRect(x, y, w, h);

  ctx.shadowBlur = 0;
  ctx.strokeStyle = "rgba(255,255,255,0.55)";
  ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, Math.max(w - 1, 0), Math.max(h - 1, 0));

  ctx.strokeStyle = "rgba(255,255,255,0.22)";
  ctx.beginPath();
  const step = Math.max(7, Math.min(w, h) / 3.2);
  if (w >= h) {
    for (let i = step; i < w; i += step) { ctx.moveTo(x + i, y); ctx.lineTo(x + i, y + h); }
  } else {
    for (let i = step; i < h; i += step) { ctx.moveTo(x, y + i); ctx.lineTo(x + w, y + i); }
  }
  ctx.stroke();
  ctx.restore();
}

function drawNeonButton(rect, label, color, fontScale) {
  fontScale = fontScale || 0.42;
  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = 20;
  ctx.fillStyle = "rgba(6,10,14,0.65)";
  roundRectPath(ctx, rect.x, rect.y, rect.w, rect.h, rect.h * 0.22);
  ctx.fill();
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = color;
  ctx.stroke();
  ctx.restore();
  drawNeonText(label, rect.x + rect.w / 2, rect.y + rect.h / 2, rect.h * fontScale, color, 14);
}

function pointInRect(px, py, r) {
  return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
}

// ============================================================
// JOUEUR
// ============================================================

const PLAYER_SIZE = 34;
const PLAYER_SPEED = 340.0;

let player = { x: 0, y: 0, w: PLAYER_SIZE, h: PLAYER_SIZE };

function resetPlayer() {
  player.x = WIDTH / 2 - PLAYER_SIZE / 2;
  player.y = HEIGHT / 2 - PLAYER_SIZE / 2;
}

// ============================================================
// BOUTONS TACTILES (mouvement) - fleches seules, pas de fond
// ============================================================

const BUTTON_SIZE = 84;
const BUTTON_MARGIN = 24;

let buttonUp = {}, buttonLeft = {}, buttonDown = {}, buttonRight = {};

// Boutons menu / fin de partie (recalcules a chaque resize)
let playButton = {};
let restartButton = {};
let menuButton = {};

function computeLayout() {
  buttonUp = { x: BUTTON_MARGIN + BUTTON_SIZE, y: HEIGHT - BUTTON_MARGIN - BUTTON_SIZE * 2, w: BUTTON_SIZE, h: BUTTON_SIZE };
  buttonLeft = { x: BUTTON_MARGIN, y: HEIGHT - BUTTON_MARGIN - BUTTON_SIZE, w: BUTTON_SIZE, h: BUTTON_SIZE };
  buttonDown = { x: BUTTON_MARGIN + BUTTON_SIZE, y: HEIGHT - BUTTON_MARGIN - BUTTON_SIZE, w: BUTTON_SIZE, h: BUTTON_SIZE };
  buttonRight = { x: BUTTON_MARGIN + BUTTON_SIZE * 2, y: HEIGHT - BUTTON_MARGIN - BUTTON_SIZE, w: BUTTON_SIZE, h: BUTTON_SIZE };

  const pbW = Math.min(320, WIDTH * 0.5);
  const pbH = 74;
  playButton = { x: WIDTH / 2 - pbW / 2, y: HEIGHT * 0.62, w: pbW, h: pbH };

  const rbW = Math.min(280, WIDTH * 0.42);
  const rbH = 68;
  const gap = 22;
  restartButton = { x: WIDTH / 2 - rbW - gap / 2, y: HEIGHT * 0.62, w: rbW, h: rbH };
  menuButton = { x: WIDTH / 2 + gap / 2, y: HEIGHT * 0.62, w: rbW, h: rbH };
}

// ============================================================
// ETAT DE PARTIE
// ============================================================

const MAX_LIVES = 3;
let lives = MAX_LIVES;

let level = 1;
const MAX_LEVEL = 50;
let bestLevel = parseInt(localStorage.getItem(BEST_LEVEL_KEY) || "1", 10);

const LEVEL_TIME = 7.0;
let levelTimer = 0.0;
let waitingForClear = false;

let respawnTimer = 0.0;
const RESPAWN_DELAY = 0.8;

let invincibleTimer = 0.0;
const INVINCIBLE_TIME = 1.2;

const RECTANGLE_MODELS = [
  [150, 28],
  [210, 30],
  [280, 32],
  [360, 34],
  [470, 36]
];

let enemies = [];

function updateBestLevel() {
  if (level > bestLevel) {
    bestLevel = level;
    localStorage.setItem(BEST_LEVEL_KEY, String(bestLevel));
  }
}

// ============================================================
// UTILITAIRES JEU
// ============================================================

function rand(min, max) { return Math.random() * (max - min) + min; }
function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
function choice(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function inflate(rect, dw, dh) {
  return { x: rect.x - dw / 2, y: rect.y - dh / 2, w: rect.w + dw, h: rect.h + dh };
}

function getLevelEnemyCount(lvl) { return Math.min(2 + Math.floor((lvl - 1) / 4), 13); }
function getBlueSpeed(lvl) { return 190 + lvl * 7; }
function getGreenChance(lvl) { if (lvl < 5) return 0.0; return Math.min(0.08 + (lvl - 5) * 0.006, 0.30); }
function getGreenSpeed(lvl) { return 310 + lvl * 9; }

function createEnemy(forceType) {
  let type = forceType;
  if (!type) type = Math.random() < getGreenChance(level) ? "green" : "blue";

  const [modelLength, modelThickness] = choice(RECTANGLE_MODELS);
  let speed, color;
  if (type === "green") { speed = getGreenSpeed(level) * rand(0.90, 1.10); color = GREEN; }
  else { speed = getBlueSpeed(level) * rand(0.85, 1.15); color = BLUE; }

  const direction = choice(["horizontal", "vertical"]);
  let x, y, dx, dy, w, h;

  if (direction === "horizontal") {
    if (Math.random() < 0.5) { x = -modelLength; dx = speed; } else { x = WIDTH; dx = -speed; }
    y = randInt(55, Math.max(56, HEIGHT - 55 - modelThickness));
    dy = 0; w = modelLength; h = modelThickness;
  } else {
    if (Math.random() < 0.5) { y = -modelLength; dy = speed; } else { y = HEIGHT; dy = -speed; }
    x = randInt(55, Math.max(56, WIDTH - 55 - modelThickness));
    dx = 0; w = modelThickness; h = modelLength;
  }

  return { x, y, dx, dy, w, h, direction, color, type };
}

function playerIsSafeAt(candidate) {
  const safe = inflate(candidate, 70, 70);
  for (const e of enemies) if (rectsOverlap(safe, e)) return false;
  return true;
}

function respawnPlayerSafe() {
  for (let attempt = 0; attempt < 150; attempt++) {
    const x = randInt(30, Math.max(31, WIDTH - PLAYER_SIZE - 30));
    const y = randInt(70, Math.max(71, HEIGHT - PLAYER_SIZE - 30));
    const candidate = { x, y, w: PLAYER_SIZE, h: PLAYER_SIZE };
    if (playerIsSafeAt(candidate)) { player.x = x; player.y = y; return; }
  }
  resetPlayer();
}

function createLevel() {
  enemies = [];
  const target = getLevelEnemyCount(level);
  const playerZone = inflate(player, 180, 180);
  for (let i = 0; i < target; i++) {
    let enemy = createEnemy();
    let tries = 0;
    while (rectsOverlap(enemy, playerZone) && tries < 30) { enemy = createEnemy(); tries++; }
    enemies.push(enemy);
  }
}

// ============================================================
// FOND FLOUTE (capture figee de la partie)
// ============================================================

const bgCanvas = document.createElement("canvas");
const bgCtx = bgCanvas.getContext("2d");
let hasBackgroundSnapshot = false;

function captureBackgroundSnapshot() {
  bgCanvas.width = canvas.width;
  bgCanvas.height = canvas.height;
  bgCtx.drawImage(canvas, 0, 0);
  hasBackgroundSnapshot = true;
}

function drawBlurredBackground() {
  ctx.fillStyle = BLACK;
  ctx.fillRect(0, 0, WIDTH, HEIGHT);
  if (hasBackgroundSnapshot) {
    ctx.save();
    ctx.filter = "blur(14px) brightness(0.45) saturate(1.3)";
    ctx.drawImage(bgCanvas, 0, 0, WIDTH, HEIGHT);
    ctx.restore();
  }
  const grad = ctx.createLinearGradient(0, 0, 0, HEIGHT);
  grad.addColorStop(0, "rgba(0,0,0,0.35)");
  grad.addColorStop(1, "rgba(0,0,0,0.75)");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, WIDTH, HEIGHT);
}

// ============================================================
// TRANSITIONS D'ETAT
// ============================================================

function renderSceneFrame() {
  // Dessine une frame de jeu "propre" (sans overlay) pour servir de capture
  ctx.fillStyle = BLACK;
  ctx.fillRect(0, 0, WIDTH, HEIGHT);
  for (const e of enemies) neonRect(e.x, e.y, e.w, e.h, e.color, 14);
  neonRect(player.x, player.y, player.w, player.h, RED, 18);
  ctx.strokeStyle = "rgba(255,255,255,0.5)";
  ctx.lineWidth = 3;
  ctx.strokeRect(1.5, 1.5, WIDTH - 3, HEIGHT - 3);
}

function goToMenu() {
  renderSceneFrame();
  captureBackgroundSnapshot();
  gameState = STATE_MENU;
}

function startGame() {
  lives = MAX_LIVES;
  level = 1;
  levelTimer = 0.0;
  waitingForClear = false;
  respawnTimer = 0.0;
  invincibleTimer = 0.0;
  resetPlayer();
  createLevel();
  gameState = STATE_PLAYING;
}

function endGame(won) {
  updateBestLevel();
  renderSceneFrame();
  captureBackgroundSnapshot();
  gameState = won ? STATE_VICTORY : STATE_GAMEOVER;
}

// ============================================================
// ENTREES : CLAVIER
// ============================================================

const keysDown = {};
window.addEventListener("keydown", (e) => {
  keysDown[e.key.toLowerCase()] = true;
  if (e.key.toLowerCase() === "r" && (gameState === STATE_GAMEOVER || gameState === STATE_VICTORY)) {
    startGame();
  }
  if ((e.key === "Enter" || e.key === " ") && gameState === STATE_MENU) {
    startGame();
  }
});
window.addEventListener("keyup", (e) => { keysDown[e.key.toLowerCase()] = false; });

// ============================================================
// ENTREES : TACTILE / SOURIS
// ============================================================

const activeTouches = new Map();

function canvasPointFromEvent(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return { x: clientX - rect.left, y: clientY - rect.top };
}

function handleMenuTap(p) {
  if (gameState === STATE_MENU) {
    if (pointInRect(p.x, p.y, playButton)) startGame();
  } else if (gameState === STATE_GAMEOVER || gameState === STATE_VICTORY) {
    if (pointInRect(p.x, p.y, restartButton)) startGame();
    else if (pointInRect(p.x, p.y, menuButton)) goToMenu();
  }
}

function handleTouchStart(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const p = canvasPointFromEvent(t.clientX, t.clientY);
    activeTouches.set(t.identifier, p);
    handleMenuTap(p);
  }
}
function handleTouchMove(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    activeTouches.set(t.identifier, canvasPointFromEvent(t.clientX, t.clientY));
  }
}
function handleTouchEnd(e) {
  e.preventDefault();
  for (const t of e.changedTouches) activeTouches.delete(t.identifier);
}
canvas.addEventListener("touchstart", handleTouchStart, { passive: false });
canvas.addEventListener("touchmove", handleTouchMove, { passive: false });
canvas.addEventListener("touchend", handleTouchEnd, { passive: false });
canvas.addEventListener("touchcancel", handleTouchEnd, { passive: false });

let mouseDown = false;
let mousePos = { x: 0, y: 0 };
canvas.addEventListener("mousedown", (e) => {
  mouseDown = true;
  mousePos = canvasPointFromEvent(e.clientX, e.clientY);
  handleMenuTap(mousePos);
});
canvas.addEventListener("mousemove", (e) => { mousePos = canvasPointFromEvent(e.clientX, e.clientY); });
window.addEventListener("mouseup", () => { mouseDown = false; });

function getTouchControls() {
  let up = false, down = false, left = false, right = false;
  for (const p of activeTouches.values()) {
    if (pointInRect(p.x, p.y, buttonUp)) up = true;
    if (pointInRect(p.x, p.y, buttonDown)) down = true;
    if (pointInRect(p.x, p.y, buttonLeft)) left = true;
    if (pointInRect(p.x, p.y, buttonRight)) right = true;
  }
  if (mouseDown) {
    if (pointInRect(mousePos.x, mousePos.y, buttonUp)) up = true;
    if (pointInRect(mousePos.x, mousePos.y, buttonDown)) down = true;
    if (pointInRect(mousePos.x, mousePos.y, buttonLeft)) left = true;
    if (pointInRect(mousePos.x, mousePos.y, buttonRight)) right = true;
  }
  return { up, down, left, right };
}

// ============================================================
// REDIMENSIONNEMENT PLEIN ECRAN
// ============================================================

function resize() {
  WIDTH = window.innerWidth;
  HEIGHT = window.innerHeight;
  canvas.width = WIDTH;
  canvas.height = HEIGHT;
  canvas.style.width = WIDTH + "px";
  canvas.style.height = HEIGHT + "px";
  computeLayout();
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", resize);

// ============================================================
// DESSIN DES FLECHES DE CONTROLE (sans fond, plus grandes)
// ============================================================

function drawArrow(rect, direction) {
  const cx = rect.x + rect.w / 2;
  const cy = rect.y + rect.h / 2;
  const s = rect.w * 0.5;
  ctx.save();
  ctx.shadowColor = BLUE;
  ctx.shadowBlur = 16;
  ctx.fillStyle = "rgba(255,255,255,0.92)";
  ctx.beginPath();
  if (direction === "up") { ctx.moveTo(cx, cy - s); ctx.lineTo(cx - s, cy + s * 0.8); ctx.lineTo(cx + s, cy + s * 0.8); }
  else if (direction === "down") { ctx.moveTo(cx, cy + s); ctx.lineTo(cx - s, cy - s * 0.8); ctx.lineTo(cx + s, cy - s * 0.8); }
  else if (direction === "left") { ctx.moveTo(cx - s, cy); ctx.lineTo(cx + s * 0.8, cy - s); ctx.lineTo(cx + s * 0.8, cy + s); }
  else { ctx.moveTo(cx + s, cy); ctx.lineTo(cx - s * 0.8, cy - s); ctx.lineTo(cx - s * 0.8, cy + s); }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// ============================================================
// INTERFACE EN JEU
// ============================================================

function drawUI() {
  drawNeonText("NIVEAU " + level + " / " + MAX_LEVEL, 26, 34, 22, BLUE, 12, "left");

  const labelW = 92;
  drawNeonText("VIES", WIDTH - labelW - 100, 34, 20, RED, 10, "left");
  for (let i = 0; i < MAX_LIVES; i++) {
    const x = WIDTH - 95 + i * 30;
    const y = 24;
    if (i < lives) neonRect(x, y, 20, 20, RED, 12);
    else { ctx.strokeStyle = GRAY; ctx.lineWidth = 2; ctx.strokeRect(x, y, 20, 20); }
  }

  if (waitingForClear) {
    drawNeonText("NETTOYAGE...", WIDTH / 2, 34, 20, GREEN, 12);
  }
}

// ============================================================
// ECRAN MENU
// ============================================================

function drawMenuScreen() {
  drawBlurredBackground();

  drawNeonText("BLUE DODGE", WIDTH / 2, HEIGHT * 0.28, Math.min(72, WIDTH * 0.11), BLUE, 28, "center", 900);
  drawNeonText("ESQUIVE OU DISPARAIS", WIDTH / 2, HEIGHT * 0.28 + Math.min(72, WIDTH * 0.11) * 0.62, Math.min(20, WIDTH * 0.03), WHITE, 8, "center", 500);

  drawNeonText("MEILLEUR NIVEAU : " + bestLevel, WIDTH / 2, HEIGHT * 0.46, Math.min(26, WIDTH * 0.04), GREEN, 10, "center", 700);

  drawNeonButton(playButton, "JOUER", RED, 0.4);

  drawNeonText(STUDIO_NAME, WIDTH / 2, HEIGHT - 46, 18, WHITE, 8, "center", 500);
  drawNeonText(GAME_VERSION, WIDTH - 20, HEIGHT - 20, 14, GRAY, 4, "right", 500);
}

// ============================================================
// ECRANS FIN DE PARTIE
// ============================================================

function drawEndScreen(won) {
  drawBlurredBackground();

  const titleColor = won ? GREEN : RED;
  const titleText = won ? "VICTOIRE !" : "GAME OVER";
  drawNeonText(titleText, WIDTH / 2, HEIGHT * 0.30, Math.min(64, WIDTH * 0.09), titleColor, 26, "center", 900);

  const subText = won ? "Tu as terminé les " + MAX_LEVEL + " niveaux !" : "Niveau atteint : " + level;
  drawNeonText(subText, WIDTH / 2, HEIGHT * 0.30 + Math.min(64, WIDTH * 0.09) * 0.7, Math.min(22, WIDTH * 0.032), WHITE, 8, "center", 500);

  drawNeonText("MEILLEUR NIVEAU : " + bestLevel, WIDTH / 2, HEIGHT * 0.48, Math.min(22, WIDTH * 0.032), BLUE, 8, "center", 700);

  drawNeonButton(restartButton, "REJOUER", RED, 0.32);
  drawNeonButton(menuButton, "MENU", BLUE, 0.32);
}

// ============================================================
// BOUCLE PRINCIPALE
// ============================================================

resize();
resetPlayer();
level = 1;
createLevel();
renderSceneFrame();
captureBackgroundSnapshot();
gameState = STATE_MENU;

let lastTime = performance.now();

function loop(now) {
  let dt = (now - lastTime) / 1000.0;
  lastTime = now;
  if (dt > 0.05) dt = 0.05;

  if (gameState === STATE_MENU) {
    drawMenuScreen();
    requestAnimationFrame(loop);
    return;
  }
  if (gameState === STATE_GAMEOVER || gameState === STATE_VICTORY) {
    drawEndScreen(gameState === STATE_VICTORY);
    requestAnimationFrame(loop);
    return;
  }

  // --------------------------------------------------------
  // CONTROLES
  // --------------------------------------------------------
  let movingUp = keysDown["z"] || keysDown["arrowup"] || false;
  let movingDown = keysDown["s"] || keysDown["arrowdown"] || false;
  let movingLeft = keysDown["q"] || keysDown["arrowleft"] || false;
  let movingRight = keysDown["d"] || keysDown["arrowright"] || false;

  const touch = getTouchControls();
  movingUp = movingUp || touch.up;
  movingDown = movingDown || touch.down;
  movingLeft = movingLeft || touch.left;
  movingRight = movingRight || touch.right;

  // --------------------------------------------------------
  // JOUEUR
  // --------------------------------------------------------
  if (invincibleTimer > 0) invincibleTimer -= dt;
  if (respawnTimer > 0) respawnTimer -= dt;

  if (respawnTimer <= 0) {
    let mx = 0, my = 0;
    if (movingLeft) mx -= 1;
    if (movingRight) mx += 1;
    if (movingUp) my -= 1;
    if (movingDown) my += 1;
    if (mx !== 0 || my !== 0) {
      const len = Math.sqrt(mx * mx + my * my);
      mx /= len; my /= len;
      player.x += mx * PLAYER_SPEED * dt;
      player.y += my * PLAYER_SPEED * dt;
    }
  }

  // --------------------------------------------------------
  // BORDURE
  // --------------------------------------------------------
  const innerLeft = 3, innerTop = 3, innerRight = WIDTH - 3, innerBottom = HEIGHT - 3;
  const outOfBounds = player.x < innerLeft || player.y < innerTop ||
    player.x + player.w > innerRight || player.y + player.h > innerBottom;

  if (outOfBounds && invincibleTimer <= 0) {
    lives -= 1;
    respawnPlayerSafe();
    invincibleTimer = INVINCIBLE_TIME;
    respawnTimer = RESPAWN_DELAY;
    if (lives <= 0) { endGame(false); requestAnimationFrame(loop); return; }
  }

  // --------------------------------------------------------
  // ENNEMIS - DEPLACEMENT
  // --------------------------------------------------------
  for (const e of enemies) { e.x += e.dx * dt; e.y += e.dy * dt; }

  // --------------------------------------------------------
  // COLLISION
  // --------------------------------------------------------
  if (invincibleTimer <= 0) {
    let collision = false;
    for (const e of enemies) { if (rectsOverlap(player, e)) { collision = true; break; } }
    if (collision) {
      lives -= 1;
      respawnPlayerSafe();
      invincibleTimer = INVINCIBLE_TIME;
      respawnTimer = RESPAWN_DELAY;
      if (lives <= 0) { endGame(false); requestAnimationFrame(loop); return; }
    }
  }

  // --------------------------------------------------------
  // SUPPRESSION DES ENNEMIS HORS ECRAN
  // --------------------------------------------------------
  enemies = enemies.filter(e => !(e.x + e.w < 0 || e.x > WIDTH || e.y + e.h < 0 || e.y > HEIGHT));

  // --------------------------------------------------------
  // PROGRESSION
  // --------------------------------------------------------
  if (!waitingForClear) {
    levelTimer += dt;
    const requiredTime = LEVEL_TIME + level * 0.15;
    if (levelTimer >= requiredTime) waitingForClear = true;
  } else if (enemies.length === 0) {
    if (level < MAX_LEVEL) {
      level += 1;
      updateBestLevel();
      levelTimer = 0.0;
      waitingForClear = false;
      respawnPlayerSafe();
      invincibleTimer = 0.8;
      createLevel();
    } else {
      endGame(true);
      requestAnimationFrame(loop);
      return;
    }
  }

  // --------------------------------------------------------
  // CREATION DES ENNEMIS
  // --------------------------------------------------------
  if (!waitingForClear) {
    const targetCount = getLevelEnemyCount(level);
    while (enemies.length < targetCount) enemies.push(createEnemy());
  }

  // --------------------------------------------------------
  // AFFICHAGE
  // --------------------------------------------------------
  ctx.fillStyle = BLACK;
  ctx.fillRect(0, 0, WIDTH, HEIGHT);

  for (const e of enemies) neonRect(e.x, e.y, e.w, e.h, e.color, 14);

  if (invincibleTimer <= 0 || Math.floor(invincibleTimer * 10) % 2 === 0) {
    neonRect(player.x, player.y, player.w, player.h, RED, 20);
  }

  ctx.strokeStyle = "rgba(255,255,255,0.5)";
  ctx.lineWidth = 3;
  ctx.strokeRect(1.5, 1.5, WIDTH - 3, HEIGHT - 3);

  drawUI();

  drawArrow(buttonUp, "up");
  drawArrow(buttonLeft, "left");
  drawArrow(buttonDown, "down");
  drawArrow(buttonRight, "right");

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
